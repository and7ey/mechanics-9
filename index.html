<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Механика. Инженеры будущего. 9 класс</title>
<meta name="description" content="Интерактивная 3D-книга по механике для 9 класса: упругость, вес тела, трение. Каждый рисунок поднимается со страницы." />
<meta property="og:title" content="Механика. Инженеры будущего. 9 класс" />
<meta property="og:description" content="Пять интерактивных разворотов: закон Гука, вес тела и сила трения." />
<meta name="theme-color" content="#0d0b12" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  #boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 38%,#1d1622 0%,#0d0b12 58%,#08070b 100%);color:#e9e7ef;font:500 13px/1.4 "Source Serif 4",Georgia,serif;transition:opacity .6s ease,visibility 0s .7s}
  #boot.done{opacity:0;visibility:hidden;pointer-events:none}
  #boot .in{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 24px;text-align:center}
  #boot .t{font:600 clamp(22px,4vmin,34px)/1.1 "Source Serif 4",Georgia,serif;letter-spacing:.02em}
  #boot .s{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#8e93aa}
  #boot .bar{width:clamp(140px,22vmin,190px);height:2px;border-radius:2px;background:rgba(142,147,170,.18);overflow:hidden}
  #boot .bar i{display:block;width:35%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ffe08a,#ff9b3d 45%,#ff5e5b 75%,#c2246b);animation:run 1.25s ease-in-out infinite}
  @keyframes run{0%{transform:translateX(-110%)}100%{transform:translateX(390%)}}
  @media (prefers-reduced-motion: reduce){#boot .bar i{animation:none;width:100%}}
</style>
</head>
<body>
<div id="boot"><div class="in">
  <div class="t">Механика</div>
  <div class="s">Инженеры будущего · 9 класс</div>
  <div class="bar"><i></i></div>
</div></div>
<canvas id="c" aria-label="Интерактивная книга. Используйте текстовую версию или стрелки для перелистывания."></canvas>
<div id="a11y-live" class="sr" aria-live="polite"></div>
<aside id="panel" hidden>
  <div class="panel-head">
    <strong id="panel-title">Текст разворота</strong>
    <button id="panel-close" type="button" aria-label="Закрыть">×</button>
  </div>
  <div id="panel-body"></div>
</aside>
<nav id="nav" aria-label="Управление книгой">
  <button id="n-contents" type="button" aria-label="Содержание" title="Содержание">☰</button>
  <button id="n-prev" type="button" aria-label="Предыдущий разворот" title="Назад">‹</button>
  <div id="n-where"><b id="n-num"></b><span id="n-title"></span></div>
  <button id="n-next" type="button" aria-label="Следующий разворот" title="Вперёд">›</button>
  <button id="n-sound" type="button" aria-label="Звук" aria-pressed="false" title="Звук">♪</button>
  <button id="n-text" type="button" aria-label="Текстовая версия" title="Текст">Т</button>
</nav>
<main id="sr" class="sr" aria-label="Текстовая версия книги"></main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
